<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuel Route Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.4 system-ui, sans-serif; color: #1c2430; display: flex; height: 100vh; }
    aside { width: 360px; padding: 16px; overflow-y: auto; border-right: 1px solid #dde2e8; background: #f7f9fb; }
    #map { flex: 1; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 4px; }
    input { width: 100%; padding: 8px; border: 1px solid #c4ccd6; border-radius: 6px; font: inherit; }
    button { margin-top: 14px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #1a5fb4; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .msg { margin-top: 14px; padding: 10px; border-radius: 6px; background: #fdecea; color: #8a1c13; }
    .summary { margin-top: 14px; padding: 10px; background: #fff; border: 1px solid #dde2e8; border-radius: 6px; }
    .summary b { font-size: 20px; }
    ol { padding-left: 20px; }
    li { margin-bottom: 10px; }
    small { color: #5b6673; }
    @media (max-width: 760px) { body { flex-direction: column-reverse; } aside { width: 100%; height: 45vh; border-right: 0; } #map { height: 55vh; flex: none; } }
  </style>
</head>
<body>
  <aside>
    <h1>Fuel Route Planner</h1>
    <form id="form">
      <label for="start">Start</label>
      <input id="start" name="start" value="Chicago, IL" required>
      <label for="finish">Finish</label>
      <input id="finish" name="finish" value="Denver, CO" required>
      <button id="go" type="submit">Plan route</button>
    </form>
    <div id="out"></div>
  </aside>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([39.5, -98.35], 4);
    L.tileLayer('{{ tile_url|escapejs }}', {
      maxZoom: 18, attribution: '{{ tile_attribution|escapejs }}'
    }).addTo(map);
    let layer = null;
    const out = document.getElementById('out');
    const go = document.getElementById('go');

    function el(tag, text, cls) {
      const e = document.createElement(tag);
      if (text !== undefined) e.textContent = text;
      if (cls) e.className = cls;
      return e;
    }

    async function plan(start, finish) {
      go.disabled = true;
      out.replaceChildren(el('p', 'Planning...'));
      try {
        const qs = new URLSearchParams({ start, finish });
        const res = await fetch('/api/route/?' + qs);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error ? data.error.message : 'Request failed');
        render(data);
      } catch (err) {
        out.replaceChildren(el('div', err.message, 'msg'));
      } finally {
        go.disabled = false;
      }
    }

    function render(d) {
      if (layer) layer.remove();
      layer = L.geoJSON(d.map.geojson, {
        style: { color: '#1a5fb4', weight: 4 },
        pointToLayer: (f, ll) => L.marker(ll).bindPopup(
          (() => { const b = el('div'); b.append(el('b', f.properties.order + '. ' + f.properties.name),
            el('br'), '$' + f.properties.price_per_gallon.toFixed(3) + '/gal, $' + f.properties.cost.toFixed(2)); return b; })()
        ),
      }).addTo(map);
      map.fitBounds(d.map.bounds);

      const box = el('div', undefined, 'summary');
      box.append(el('b', '$' + d.total_fuel_cost.toFixed(2)), el('div', 'fuel purchased at stops'),
        el('small', d.total_distance_miles.toFixed(0) + ' miles, ' + d.total_duration_hours + ' h driving, ' +
          d.fuel_stops.length + ' stop(s). ' + d.assumptions.vehicle_range_miles + ' mile range, ' + d.assumptions.mpg + ' mpg.'));
      const list = el('ol');
      d.fuel_stops.forEach(s => {
        const li = el('li');
        li.append(el('b', s.name), el('br'), s.address + ', ' + s.city + ', ' + s.state, el('br'),
          el('small', 'mile ' + s.route_mile + ' | ' + s.gallons + ' gal @ $' + s.price_per_gallon.toFixed(3) + ' = $' + s.cost.toFixed(2)));
        list.append(li);
      });
      out.replaceChildren(box, list);
    }

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      plan(document.getElementById('start').value, document.getElementById('finish').value);
    });
    const q = new URLSearchParams(location.search);
    if (q.get('start') && q.get('finish')) {
      document.getElementById('start').value = q.get('start');
      document.getElementById('finish').value = q.get('finish');
      plan(q.get('start'), q.get('finish'));
    }
  </script>
</body>
</html>
